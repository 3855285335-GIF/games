<style>
:root{--y:#ffd23f;--bg:#101216;--card:rgba(18,20,26,.86);--line:rgba(255,255,255,.14);--sat:env(safe-area-inset-top);--sab:env(safe-area-inset-bottom);--sal:env(safe-area-inset-left);--sar:env(safe-area-inset-right)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:#fff;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Helvetica Neue",sans-serif;touch-action:none;overscroll-behavior:none;position:fixed;inset:0}
#gl{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
.hide{display:none!important}
#hud{position:fixed;inset:0;pointer-events:none}
#score{position:absolute;left:calc(14px + var(--sal));top:calc(10px + var(--sat));text-shadow:0 1px 6px rgba(0,0,0,.45)}
#score .n{font-size:30px;font-weight:800;letter-spacing:.5px;line-height:1}
#score .s{font-size:12px;opacity:.85;margin-top:4px}
#timer{font-size:22px;font-weight:800;color:var(--y);margin-top:4px}
#combo{position:absolute;left:0;right:0;top:calc(19% + var(--sat));text-align:center;text-shadow:0 2px 8px rgba(0,0,0,.6);transition:opacity .2s}
#combo .names{font-size:15px;font-weight:700;line-height:1.35;opacity:.95;padding:0 20px}
#combo .pts{font-size:26px;font-weight:900;color:var(--y);margin-top:2px}
#toast{position:absolute;left:0;right:0;top:calc(32% + var(--sat));text-align:center;font-size:30px;font-weight:900;letter-spacing:1px;text-shadow:0 2px 10px rgba(0,0,0,.6);opacity:0;transform:scale(.9);transition:opacity .2s,transform .2s}
#toast.on{opacity:1;transform:scale(1)}
#toast small{display:block;font-size:14px;font-weight:700;opacity:.9;margin-top:4px}
#topbtns{position:absolute;right:calc(10px + var(--sar));top:calc(10px + var(--sat));display:flex;gap:8px;pointer-events:auto}
.ib{width:42px;height:42px;border-radius:50%;background:rgba(0,0,0,.36);border:1px solid rgba(255,255,255,.22);color:#fff;font-size:18px;display:flex;align-items:center;justify-content:center;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
#plist{position:absolute;right:calc(12px + var(--sar));top:calc(60px + var(--sat));font-size:12px;text-align:right;line-height:1.55;text-shadow:0 1px 3px rgba(0,0,0,.7);max-width:46vw}
#net{position:absolute;left:calc(12px + var(--sal));bottom:calc(8px + var(--sab));font-size:11px;opacity:.7;text-shadow:0 1px 3px rgba(0,0,0,.7)}
#meter{position:absolute;right:calc(18px + var(--sar));top:38%;width:12px;height:150px;border-radius:7px;background:rgba(0,0,0,.4);border:1px solid rgba(255,255,255,.3);overflow:hidden}
#meter .zone{position:absolute;left:0;right:0;background:rgba(80,220,120,.55)}
#meter .bad{position:absolute;left:0;right:0;top:0;background:rgba(255,80,70,.5)}
#meter .ndl{position:absolute;left:-2px;right:-2px;height:4px;background:#fff;border-radius:2px;box-shadow:0 0 6px #fff}
#hint{position:absolute;left:16px;right:16px;bottom:calc(30px + var(--sab));text-align:center;font-size:15px;font-weight:700;text-shadow:0 1px 6px rgba(0,0,0,.7);transition:opacity .3s}
#labels,#dots,#spots{position:fixed;inset:0;pointer-events:none;overflow:hidden}
.tag{position:absolute;left:0;top:0;font-size:12px;font-weight:700;padding:2px 8px;border-radius:10px;background:rgba(0,0,0,.45);white-space:nowrap;will-change:transform}
.tag i{display:block;font-style:normal;font-size:11px;color:var(--y);text-align:center}
.dot{position:absolute;left:0;top:0;width:54px;height:54px;margin:-27px 0 0 -27px;border-radius:50%;border:2px solid rgba(255,255,255,.75);background:rgba(255,255,255,.14);will-change:transform}
.dot.back{border-color:rgba(255,210,63,.95)}
.spot{position:absolute;left:0;top:0;width:46px;height:46px;margin:-23px 0 0 -23px;border-radius:50%;border:2px dashed rgba(255,255,255,.8);background:rgba(255,255,255,.12);will-change:transform;animation:pulse 1.4s ease-in-out infinite}
@keyframes pulse{50%{transform-origin:center;opacity:.45}}
/* 面板 */
.ov{position:fixed;inset:0;display:flex;align-items:flex-end;justify-content:center;padding:16px;padding-bottom:calc(16px + var(--sab));z-index:10;background:linear-gradient(to top,rgba(10,12,16,.85),rgba(10,12,16,.25) 60%,rgba(10,12,16,0));pointer-events:auto}
.ov.mid{align-items:center;background:rgba(10,12,16,.55)}
.card{width:min(420px,100%);background:var(--card);border:1px solid var(--line);border-radius:22px;padding:18px;backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);max-height:calc(100% - var(--sat) - 10px);overflow-y:auto;-webkit-overflow-scrolling:touch;touch-action:pan-y}
.logo{text-align:center;margin:2px 0 14px}
.logo b{display:block;font-size:40px;font-weight:900;letter-spacing:5px;line-height:1}
.logo span{font-size:13px;opacity:.6;letter-spacing:2px}
.btn{display:flex;align-items:center;justify-content:center;width:100%;padding:14px;border:0;border-radius:14px;background:rgba(255,255,255,.1);color:#fff;font-size:16px;font-weight:700;margin-top:8px;font-family:inherit}
.btn.pri{background:var(--y);color:#111;font-size:18px;font-weight:800}
.btn small{opacity:.7;font-weight:600;margin-left:6px;font-size:13px}
.row{display:flex;gap:8px}.row>*{flex:1}
input.in{width:100%;padding:12px 13px;border-radius:12px;border:1px solid var(--line);background:rgba(255,255,255,.07);color:#fff;font-size:16px;-webkit-user-select:text;user-select:text;outline:none;font-family:inherit;margin-top:8px}
.lbl{font-size:12px;opacity:.55;margin:14px 2px 0}
#decks{display:flex;gap:8px;overflow-x:auto;padding:8px 2px 4px;touch-action:pan-x;-webkit-overflow-scrolling:touch}
#decks img{width:96px;height:30px;border-radius:15px;border:3px solid transparent;flex:none;object-fit:cover}
#decks img.on{border-color:#fff}
.note{font-size:12px;opacity:.55;text-align:center;margin-top:12px;line-height:1.5}
.sw{display:flex;align-items:center;justify-content:space-between;padding:12px 2px;border-bottom:1px solid var(--line);font-size:15px}
.sw:last-child{border-bottom:0}
.tg{width:50px;height:30px;border-radius:15px;background:rgba(255,255,255,.18);position:relative;flex:none}
.tg::after{content:"";position:absolute;left:3px;top:3px;width:24px;height:24px;border-radius:50%;background:#fff;transition:left .15s}
.tg.on{background:#34c759}.tg.on::after{left:23px}
.seg{display:flex;background:rgba(255,255,255,.1);border-radius:10px;padding:2px}
.seg span{padding:6px 12px;border-radius:8px;font-size:14px}
.seg span.on{background:#fff;color:#111;font-weight:700}
h3{margin:2px 0 10px;font-size:20px}
.step{display:flex;gap:12px;align-items:flex-start;padding:10px 0;border-bottom:1px solid var(--line);font-size:14px;line-height:1.5}
.step:last-child{border-bottom:0}
.step b{color:var(--y)}
.pic{flex:none;width:56px;height:56px;border-radius:12px;background:rgba(255,255,255,.08);position:relative}
.pic .bd{position:absolute;left:21px;top:5px;width:14px;height:46px;border-radius:7px;background:#ddd}
.pic .f{position:absolute;width:14px;height:14px;border-radius:50%;background:var(--y);border:2px solid #111}
.pic .ar{position:absolute;font-size:16px;font-weight:900;color:#fff}
.ch{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line);font-size:14px}
.ch .ck{width:22px;height:22px;border-radius:50%;border:2px solid rgba(255,255,255,.35);flex:none;display:flex;align-items:center;justify-content:center;font-size:13px}
.ch.ok .ck{background:#34c759;border-color:#34c759}
.ch.ok span{opacity:.6}
.big{font-size:44px;font-weight:900;text-align:center;color:var(--y);margin:6px 0}
#err{position:fixed;left:10px;right:10px;bottom:10px;font-size:12px;color:#ff8a80;z-index:99;pointer-events:none;text-shadow:0 1px 3px #000}

#fx2d{position:fixed;inset:0;width:100%;height:100%;pointer-events:none}
#score .lbl2{font-size:11px;opacity:.7;margin-top:2px}
#log{position:absolute;left:calc(14px + var(--sal));top:calc(84px + var(--sat));font-size:11px;line-height:1.5;opacity:.85;text-shadow:0 1px 3px rgba(0,0,0,.7);max-width:46vw}
#log div{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#log b{color:var(--y)}
#combo{top:calc(12px + var(--sat))!important;left:20%!important;right:20%!important}
#combo .names{font-size:13px!important;padding:0!important}
#combo .pts{font-size:21px!important}
#pop{position:absolute;left:0;top:0;font-size:20px;font-weight:900;white-space:nowrap;text-shadow:0 2px 8px rgba(0,0,0,.7);opacity:0;will-change:transform;pointer-events:none}
#pop.on{animation:popup 1.1s ease-out forwards}
@keyframes popup{0%{opacity:0;margin-top:10px}12%{opacity:1;margin-top:0}75%{opacity:1}100%{opacity:0;margin-top:-26px}}
.emo{position:absolute;left:0;top:0;font-size:34px;will-change:transform;pointer-events:none}
.dot.ghost{border-color:rgba(255,255,255,.3);background:rgba(120,120,120,.18);width:40px;height:40px;margin:-20px 0 0 -20px}
.dot.off{border-color:rgba(255,255,255,.45);background:transparent}
#demo{position:fixed;inset:0;pointer-events:none}
